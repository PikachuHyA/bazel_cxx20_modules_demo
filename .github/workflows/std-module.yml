# CI for C++23 standard library module demos on Linux.
name: std-module

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

jobs:
  hello_std_module_libcxx:
    name: hello_std_module (Clang 20 + libc++)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: hello_std_module
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-20 and libc++
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev liblld-20-dev

      - name: Make clang-20 the default tools
        run: |
          for tool in clang clang++ clang-scan-deps; do
            sudo update-alternatives --install /usr/bin/$tool $tool /usr/bin/$tool-20 100
          done

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      - name: Build all targets
        shell: bash
        run: |
          BAZEL_LINKLIBS=-lc++:-lm BAZEL_CXXOPTS=-std=c++23:-stdlib=libc++ \
          bazel build //... --cxxopt=-std=c++23 --features=cpp_modules --features=std_module

      - name: Run demos
        shell: bash
        run: |
          for target in basic:demo hello-world:hello module-library:module_library \
                        multi_src_module:multi_src_demo template-module:example transitive:trans \
                        std-compat:demo; do
            BAZEL_LINKLIBS=-lc++:-lm BAZEL_CXXOPTS=-std=c++23:-stdlib=libc++ \
            bazel run //$target --cxxopt=-std=c++23 --features=cpp_modules --features=std_module
          done

  hello_std_module_libstdcxx:
    name: hello_std_module (Clang 20 + libstdc++)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: hello_std_module
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-20
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Make clang-20 the default tools
        run: |
          for tool in clang clang++ clang-scan-deps; do
            sudo update-alternatives --install /usr/bin/$tool $tool /usr/bin/$tool-20 100
          done

      - name: Install latest gcc (libstdc++ std module support)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Print gcc version
        run: |
          gcc --version | head -1
          gcc-16 --version | head -1

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      - name: Build all targets
        shell: bash
        run: |
          bazel build //... --cxxopt=-std=c++23 --features=cpp_modules --features=std_module

      - name: Run demos
        shell: bash
        run: |
          for target in basic:demo hello-world:hello module-library:module_library \
                        multi_src_module:multi_src_demo template-module:example transitive:trans \
                        std-compat:demo; do
            bazel run //$target --cxxopt=-std=c++23 --features=cpp_modules --features=std_module
          done

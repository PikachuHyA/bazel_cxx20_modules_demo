# CI for the hello_world C++20 modules demo on Linux.
#   - hello_world: `import foo;` from the foo.cppm module interface
name: hello-world

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello_world_clang:
    name: hello_world (Clang + libstdc++)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hello_world
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and a matching clang-scan-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools
          clang_major=$(clang -dumpversion | cut -d. -f1)
          scanner=/usr/lib/llvm-${clang_major}/bin/clang-scan-deps
          if [[ ! -x "$scanner" ]]; then
            sudo apt-get install -y "clang-${clang_major}" "clang-tools-${clang_major}"
          fi
          test -x "$scanner"
          # Bazel looks for the unversioned scanner next to the resolved clang.
          sudo ln -sfn "$scanner" /usr/bin/clang-scan-deps
          clang --version
          /usr/bin/clang-scan-deps --version

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      - name: Build demo
        shell: bash
        run: |
          bazel build //... --repo_env=CC=clang --experimental_cpp_modules

      - name: Run demo
        shell: bash
        run: |
          bazel run //:demo --repo_env=CC=clang --experimental_cpp_modules

  hello_world_gcc:
    name: hello_world (GCC + libstdc++)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hello_world
    steps:
      - uses: actions/checkout@v4

      - name: Install latest GCC (C++20 modules support)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Print gcc version
        run: |
          gcc-16 --version | head -1

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      - name: Build demo
        shell: bash
        run: |
          bazel build //... --repo_env=CC=gcc-16 --experimental_cpp_modules \
            --cxxopt -fmodules --cxxopt -Mno-modules

      - name: Run demo
        shell: bash
        run: |
          bazel run //:demo --repo_env=CC=gcc-16 --experimental_cpp_modules \
            --cxxopt -fmodules --cxxopt -Mno-modules

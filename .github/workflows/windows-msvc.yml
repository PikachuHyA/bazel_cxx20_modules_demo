# CI for the Windows/MSVC C++20 modules demos.
#   - hello_world: Windows + MSVC, `import std;` via the forked rules_cc
#   - hello_fmt:   Windows + MSVC, `import fmt;` (module support via fix.patch)
#   - hello_std_module: Windows + MSVC, the std module that the forked rules_cc
#                       injects into //cc:std_module from the MSVC STL
name: windows-msvc

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

jobs:
  hello_world:
    name: hello_world (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hello_world
    steps:
      - uses: actions/checkout@v4

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      # C:/b keeps the bazel output base on a short path, avoiding MSVC
      # long-path (MAX_PATH) issues with the module repo names in the
      # execroot. Flags are passed explicitly so the CI does not depend on
      # whether .bazelrc is committed.
      - name: Build demo
        shell: bash
        run: |
          set -o pipefail
          bazel --output_user_root=C:/b build //:demo \
            --experimental_cpp_modules \
            --features=cpp_modules \
            2>&1 | tee build.log

      - name: Verify no MSVC CRT mismatch (C5050 / LNK4098)
        shell: bash
        run: |
          if grep -E "C5050|LNK4098" build.log; then
            echo "::error::Found C5050/LNK4098 warnings: the MSVC runtime library flags of module units differ from the importing TUs"
            exit 1
          fi
          echo "No CRT mismatch warnings."

      - name: Run demo
        shell: bash
        run: bazel --output_user_root=C:/b run //:demo

  hello_std_module:
    name: hello_std_module (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hello_std_module
    steps:
      - uses: actions/checkout@v4

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      # C:/b keeps the bazel output base on a short path, avoiding MSVC
      # long-path (MAX_PATH) issues with the module repo names in the execroot.
      #
      # One --features flag per feature: --features=a,b is kept as the single
      # literal string "a,b" and silently enables nothing.
      # -default_cpp_std drops the toolchain's hardcoded /std:c++17 so it
      # cannot clash with /std:c++latest, which also has to reach the std
      # module interface: that one is compiled as @local_config_cc//:std, where
      # a target's copts has no effect.
      # MSYS_NO_PATHCONV keeps Git Bash from rewriting //pkg:target arguments
      # into /pkg:target.
      - name: Build all targets
        shell: bash
        run: |
          set -o pipefail
          export MSYS_NO_PATHCONV=1
          bazel --output_user_root=C:/b build //... \
            --experimental_cpp_modules \
            --features=cpp_modules \
            --features=std_module \
            --repo_env=BAZEL_DETECT_STD_MODULE=1 \
            --features=-default_cpp_std \
            --copt /std:c++latest \
            --copt /utf-8 \
            2>&1 | tee build.log

      - name: Verify no MSVC CRT mismatch (C5050 / LNK4098)
        shell: bash
        run: |
          if grep -E "C5050|LNK4098" build.log; then
            echo "::error::Found C5050/LNK4098 warnings: the MSVC runtime library flags of module units differ from the importing TUs"
            exit 1
          fi
          echo "No CRT mismatch warnings."

      - name: Run demos
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          for target in \
              basic:demo \
              hello-world:hello \
              module-library:module_library \
              multi_src_module:multi_src_demo \
              template-module:example \
              transitive:trans \
              std-compat:demo; do
            bazel --output_user_root=C:/b run "//$target" \
              --experimental_cpp_modules \
              --features=cpp_modules \
              --features=std_module \
              --repo_env=BAZEL_DETECT_STD_MODULE=1 \
              --features=-default_cpp_std \
              --copt /std:c++latest \
              --copt /utf-8
          done

          bazel --output_user_root=C:/b run //custom-std:demo \
            --experimental_cpp_modules \
            --features=cpp_modules \
            --features=std_module \
            --repo_env=BAZEL_DETECT_STD_MODULE=1 \
            --features=-default_cpp_std \
            --copt /std:c++latest \
            --copt /utf-8 \
            --@rules_cc//cc:std_module=//custom-std:std

  hello_fmt:
    name: hello_fmt (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hello_fmt
    steps:
      - uses: actions/checkout@v4

      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazel-version: 9.2.0

      - name: Build demo
        shell: bash
        run: |
          set -o pipefail
          bazel --output_user_root=C:/b build //:demo \
            --experimental_cpp_modules \
            --features=cpp_modules \
            2>&1 | tee build.log

      - name: Verify no MSVC CRT mismatch (C5050 / LNK4098)
        shell: bash
        run: |
          if grep -E "C5050|LNK4098" build.log; then
            echo "::error::Found C5050/LNK4098 warnings: the MSVC runtime library flags of module units differ from the importing TUs"
            exit 1
          fi
          echo "No CRT mismatch warnings."

      - name: Run demo
        shell: bash
        run: bazel --output_user_root=C:/b run //:demo
